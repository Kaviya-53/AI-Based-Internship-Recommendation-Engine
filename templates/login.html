<!DOCTYPE html>
<html>
<head>
    <title>AI Internship Recommendation Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

<div class="login-box">

    <h1>🎯 AI Internship Recommendation</h1>
    <p>Login to discover internships recommended by AI.</p>

     <form action="/login" method="POST">

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New user?
        <a href="/register">Create Account</a>
    </p>

</div>

</body>
</html>
